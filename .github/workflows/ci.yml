name: Verify platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run repository:check
      - run: npm run repository:test
      - run: npm run security:test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: test
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify unit, security, architecture, and PostgreSQL integration tests
        run: |
          chmod +x backend/mvnw
          backend/mvnw -B -ntp -f backend/pom.xml verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Use the supported npm release
        run: npm install --global npm@11.21.2 --no-fund --no-audit
      - run: npm ci --no-fund
      - run: npm run api:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the Podman Compose provider
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman-compose
      - name: Build and verify the complete Podman stack
        run: |
          npm install --global npm@11.21.2 --no-fund --no-audit
          npm ci --no-fund
          npm exec --workspace frontend -- playwright install --with-deps chromium
          node scripts/platform.mjs setup
          trap 'node scripts/platform.mjs stack-down' EXIT
          node scripts/platform.mjs stack-up
          node scripts/smoke-test.mjs
          npm run test:api-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scalar-browser-reports
          path: frontend/test-results/api-reference
          retention-days: 7
