name: foundry-production

services:
  api:
    image: ${API_IMAGE:?Set an immutable API image digest}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL JDBC URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set the least-privilege database role}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?Set the HTTPS issuer}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?Set the HTTPS JWK endpoint}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set the API audience}
      PLATFORM_API_DOCS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    secrets:
      - source: database-password
        target: spring.datasource.password
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      start_period: 60s
      interval: 15s
      timeout: 4s
      retries: 5
    stop_grace_period: 35s
    mem_limit: 768m

  web:
    image: ${WEB_IMAGE:?Set an immutable web image digest}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      BACKEND_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    mem_limit: 384m

secrets:
  database-password:
    file: ${DATABASE_PASSWORD_FILE:?Set the absolute database password file path}
