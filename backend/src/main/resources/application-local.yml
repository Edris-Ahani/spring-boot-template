platform:
  api-docs:
    enabled: true
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/platform}
    username: ${DATABASE_USERNAME:platform}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/platform}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/platform/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:platform-api}
