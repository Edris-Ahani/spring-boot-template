version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      spring-platform:
        patterns: ["org.springframework.boot:*", "org.springframework:*", "org.springframework.security:*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: [next, react, react-dom, eslint-config-next, "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
