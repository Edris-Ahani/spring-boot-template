openapi: 3.1.0
info:
  title: Foundry Catalog API
  version: 1.0.0
  description: |
    A public demonstration catalog with scoped machine-to-machine writes.

    API paths are versioned under `/api/v1`. Responses use explicit resource DTOs;
    collection responses use bounded, zero-based pagination. Timestamps are UTC.

    Errors follow RFC 9457 (`application/problem+json`). Every API response includes
    a server-generated `X-Request-ID`; errors repeat it as `requestId` for support.

    Use Authorize to paste a short-lived bearer token. Tokens must have the configured
    issuer, the `platform-api` audience, and the scope required by the operation.
    Never enter a Keycloak client secret into this browser UI.
servers:
  - url: /
    description: The same origin as this API reference
tags:
  - name: Catalog
    description: Public catalog reads and scoped catalog creation.
security:
  - bearerAuth: []
paths:
  /api/v1/catalog:
    get:
      tags: [Catalog]
      operationId: listCatalog
      summary: List public catalog items, newest first with an identifier tie-breaker
      description: Returns a zero-based page ordered by createdAt descending, then id descending. Reading is public.
      security: []
      parameters:
        - name: page
          in: query
          description: Zero-based page number, up to 10000.
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
          example: 0
        - name: size
          in: query
          description: Maximum number of items per page, up to 50.
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
          example: 12
      responses:
        '200':
          description: A bounded catalog page
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
              examples:
                emptyPage:
                  summary: An empty first page
                  value: { items: [], page: 0, size: 12, totalElements: 0, totalPages: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Catalog]
      operationId: createCatalogItem
      summary: Create a public catalog item
      description: Requires a signed token with the configured issuer, platform-api audience, and catalog:write scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCatalogItem' }
            examples:
              starter:
                summary: A new catalog item with a unique slug
                value:
                  slug: spring-platform
                  name: Spring Platform
                  description: A modular platform starter
      responses:
        '201':
          description: The created catalog item
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
              examples:
                createdItem:
                  summary: The persisted resource
                  value:
                    id: 8e756936-6419-4b0e-9c44-5b5ce3fa4627
                    slug: spring-platform
                    name: Spring Platform
                    description: A modular platform starter
                    createdAt: '2026-11-12T10:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  headers:
    RequestId:
      description: A UUID generated by the server for this request. Client-provided identifiers are not trusted.
      required: true
      schema: { type: string, format: uuid }
      example: 06a64cb2-dcf2-4f69-a3cb-34254ef2c9a1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste a short-lived access token. Catalog writes require the catalog:write scope and platform-api audience.
  schemas:
    CatalogItem:
      type: object
      required: [id, slug, name, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
    CreateCatalogItem:
      type: object
      required: [slug, name, description]
      properties:
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    CatalogPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CatalogItem' }
        page: { type: integer, minimum: 0, maximum: 10000 }
        size: { type: integer, minimum: 1, maximum: 50 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: An RFC 9457 problem with sanitized details and a server-generated correlation identifier.
      required: [type, status, title, detail, instance, requestId]
      properties:
        type: { type: string, format: uri-reference }
        status: { type: integer, minimum: 400, maximum: 599 }
        title: { type: string }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string, format: uuid }
        invalidFields:
          description: Invalid request body field names, without submitted values.
          type: array
          uniqueItems: true
          items: { type: string }
      examples:
        - type: about:blank
          status: 400
          title: Bad Request
          detail: One or more fields are invalid
          instance: /api/v1/catalog
          requestId: 06a64cb2-dcf2-4f69-a3cb-34254ef2c9a1
          invalidFields: [slug]
  responses:
    BadRequest:
      description: Invalid input or pagination
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired, or invalid bearer token
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        WWW-Authenticate:
          description: The required authentication scheme.
          schema: { type: string }
          example: Bearer
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The token does not grant the required scope
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        WWW-Authenticate:
          description: The bearer token does not grant the required scope.
          schema: { type: string }
          example: 'Bearer error="insufficient_scope"'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The slug is already in use
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotAcceptable:
      description: The requested response media type is not supported
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The request body must use application/json
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: An unexpected failure with sanitized details
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
